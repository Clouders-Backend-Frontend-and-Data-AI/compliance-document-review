name: Compliance App CI

on:
  push:
    branches:
      - main
      - backend
      - data-engineering
      - devops/infrastructure-setup
  pull_request:
    branches:
      - main
      - backend
      - data-engineering
      - devops/infrastructure-setup

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production-use-32chars
      ALLOW_INSECURE_DEFAULTS: "true"
      ENVIRONMENT: test
      ALLOW_PLAINTEXT_UPLOADS: "true"
      USE_DATA_ENGINEERING: "false"
      DATABASE_URL: sqlite:///./ci_compliance.db
      UPLOAD_DIR: ${{ github.workspace }}/uploads
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create upload directory
        run: mkdir -p "$UPLOAD_DIR"

      - name: Run backend tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t compliance-backend:ci .
