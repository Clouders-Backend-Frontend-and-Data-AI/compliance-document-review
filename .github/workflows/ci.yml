name: Compliance App CI

on:
  push:
    branches:
      - main
      - devops/infrastructure-setup

  pull_request:
    branches:
      - main
      - devops/infrastructure-setup

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: compliance_db
          POSTGRES_USER: compliance_user
          POSTGRES_PASSWORD: ci-test-password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U compliance_user -d compliance_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      UPLOAD_DIR: ${{ github.workspace }}/uploads
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create upload directory
        run: |
          mkdir -p "$UPLOAD_DIR"

      - name: Run backend tests
        run: |
          pytest -v

      - name: Build Docker image
        run: |
          docker build -t compliance-backend:ci .
